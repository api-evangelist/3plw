aid: 3plw
name: TripleW Ltd.
description: 'TripleW Ltd. (Belgian operating entity TripleW NV) is an industrial biotechnology
  and specialty-chemicals company founded in 2016, headquartered at Innovatiestraat 1, 2030
  Antwerpen, Belgium, with a US office in Shorewood, Wisconsin and R&D split between Israel and
  Belgium. Its patented process treats food waste as a third-generation renewable feedstock:
  hydrolysis, fermentation and purification yield pure lactic acid, sold under the Circulac brand
  in grades for personal care, home care, food and beverage and industrial use, and as the building
  block of polylactic acid (PLA) bioplastic. The same process chemically recycles discarded PLA back
  into feedstock, and can be installed inside existing waste-management infrastructure. Its flagship
  commercial Circulac facility is at the Port of Antwerp. TripleW sells industrial chemical product
  and engineering services, not software: no developer program, no public API, and no
  machine-readable API contract of any kind.'
